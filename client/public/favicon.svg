<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Outer Forge Wing Left Gradient -->
    <linearGradient id="leftWing" x1="64" y1="96" x2="256" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Outer Forge Wing Right Gradient -->
    <linearGradient id="rightWing" x1="448" y1="96" x2="256" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Central Anvil & Forge Core Gradient -->
    <linearGradient id="forgeCore" x1="256" y1="120" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="forgeGlow" x="30" y="30" width="452" height="452" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Obsidian Glass Texture -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#leftWing)" stroke-width="6" stroke-opacity="0.35" />

  <!-- Outer Neon Atmosphere -->
  <circle cx="256" cy="256" r="140" fill="#0284c7" opacity="0.15" filter="url(#forgeGlow)" />

  <!-- MinoForge Signature Geometric 'M + Anvil Forge' Emblem -->
  <!-- Left 'M' Pillar / Forge Pillar -->
  <path d="M96 384 V 160 L 192 128 L 224 240 L 160 384 Z" fill="url(#leftWing)" />
  
  <!-- Right 'M' Pillar / Forge Pillar -->
  <path d="M416 384 V 160 L 320 128 L 288 240 L 352 384 Z" fill="url(#rightWing)" />

  <!-- Central Forge Anvil Core & Hammer Descent -->
  <path d="M192 128 L 256 192 L 320 128 L 296 280 L 256 384 L 216 280 Z" fill="url(#forgeCore)" />

  <!-- Diamond Plasma Forge Spark (Apex) -->
  <polygon points="256,110 274,136 256,162 238,136" fill="#ffffff" />
  <circle cx="256" cy="136" r="28" fill="#38bdf8" opacity="0.6" filter="url(#forgeGlow)" />
  <circle cx="256" cy="136" r="8" fill="#ffffff" />

  <!-- High-Tech Circuit Notches for Gaming Plugin Aesthetic -->
  <rect x="96" y="270" width="28" height="6" rx="3" fill="#38bdf8" opacity="0.9" />
  <rect x="388" y="270" width="28" height="6" rx="3" fill="#38bdf8" opacity="0.9" />
  <rect x="242" y="320" width="28" height="6" rx="3" fill="#ffffff" opacity="0.8" />
</svg>