<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_discord" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_discord)"/>

  <!-- Discord In-App Embed Interface -->
  <rect x="150" y="80" width="900" height="515" rx="24" fill="#1e1f22" stroke="#5865f2" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="150" y="80" width="900" height="60" rx="24" fill="#2b2d31"/>
  <rect x="150" y="120" width="900" height="20" fill="#2b2d31"/>
  <text x="600" y="120" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">DISCORD MULTI-GUILD TICKET & VERIFICATION BOT v3.0</text>

  <!-- Discord Embed Card -->
  <rect x="200" y="165" width="800" height="260" rx="12" fill="#2b2d31" stroke="#5865f2" stroke-width="3"/>
  
  <!-- Left color bar -->
  <rect x="200" y="165" width="8" height="260" rx="4" fill="#5865f2"/>

  <!-- Embed Content -->
  <text x="230" y="205" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="bold">🎫 Need Help? Open a Support Ticket</text>
  <text x="230" y="240" fill="#dbdee1" font-family="Arial, sans-serif" font-size="14" line-height="1.5">
    Click one of the buttons below to create a private channel with our staff team:
  </text>

  <!-- Buttons in Discord -->
  <g transform="translate(230, 270)">
    <rect x="0" y="0" width="220" height="42" rx="8" fill="#5865f2"/>
    <text x="110" y="26" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🛒 Plugin Order Support</text>
  </g>

  <g transform="translate(470, 270)">
    <rect x="0" y="0" width="220" height="42" rx="8" fill="#248046"/>
    <text x="110" y="26" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🛡️ Staff Application</text>
  </g>

  <g transform="translate(230, 330)">
    <rect x="0" y="0" width="220" height="42" rx="8" fill="#4e5058"/>
    <text x="110" y="26" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🐛 Bug Report & Fixes</text>
  </g>

  <g transform="translate(470, 330)">
    <rect x="0" y="0" width="220" height="42" rx="8" fill="#da373c"/>
    <text x="110" y="26" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🔒 Close Ticket & Save HTML</text>
  </g>

  <!-- Bottom feature status -->
  <g transform="translate(200, 445)">
    <rect x="0" y="0" width="800" height="110" rx="14" fill="#2b2d31"/>
    <text x="30" y="40" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">BOT FEATURES & INTEGRATIONS</text>
    <text x="30" y="75" fill="#38bdf8" font-family="Arial, sans-serif" font-size="14" font-weight="bold">✅ Slash Commands • HTML Transcripts • Stripe Webhooks • Auto Role Assignment</text>
  </g>
</svg>
