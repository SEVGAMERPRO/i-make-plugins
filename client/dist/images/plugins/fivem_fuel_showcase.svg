<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_fuel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#311006"/>
    </linearGradient>
    <linearGradient id="fuel_accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_fuel)"/>

  <!-- FiveM In-Game Fuel Station HUD -->
  <rect x="150" y="80" width="900" height="515" rx="24" fill="#0f172a" stroke="#ea580c" stroke-width="2"/>

  <!-- Top bar -->
  <rect x="150" y="80" width="900" height="65" rx="24" fill="#1e293b"/>
  <rect x="150" y="125" width="900" height="20" fill="#1e293b"/>
  <text x="600" y="122" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">RON OIL REFUELING & EV SUPERCHARGER INTERFACE</text>

  <!-- Left: Fuel Tank Gauge -->
  <rect x="200" y="175" width="370" height="380" rx="20" fill="#182234" stroke="#334155" stroke-width="1.5"/>
  <text x="385" y="220" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CURRENT VEHICLE FUEL</text>
  
  <!-- Gauge dial circle -->
  <circle cx="385" cy="330" r="90" fill="none" stroke="#334155" stroke-width="14"/>
  <circle cx="385" cy="330" r="90" fill="none" stroke="url(#fuel_accent)" stroke-width="14" stroke-dasharray="420" stroke-dashoffset="120"/>
  <text x="385" y="325" fill="#ffffff" font-family="Arial, sans-serif" font-size="38" font-weight="900" text-anchor="middle">72%</text>
  <text x="385" y="355" fill="#f97316" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">46.8 / 65.0 Liters</text>
  
  <rect x="240" y="470" width="290" height="50" rx="12" fill="#ea580c"/>
  <text x="385" y="502" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Start Pump Refuel [E]</text>

  <!-- Right: Fuel Type & Pricing Selector -->
  <rect x="610" y="175" width="400" height="380" rx="20" fill="#182234" stroke="#334155" stroke-width="1.5"/>
  <text x="640" y="220" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16" font-weight="bold">FUEL GRADES AVAILABLE</text>

  <g transform="translate(640, 245)">
    <rect x="0" y="0" width="340" height="65" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <text x="20" y="30" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Ron 98 Premium</text>
    <text x="20" y="50" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">$3.25 / Liter • +15% Engine HP</text>
    <text x="310" y="40" fill="#10b981" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end">SELECTED</text>
  </g>

  <g transform="translate(640, 325)">
    <rect x="0" y="0" width="340" height="65" rx="12" fill="#1e293b"/>
    <text x="20" y="30" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Ron 95 Standard</text>
    <text x="20" y="50" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">$2.10 / Liter • Factory spec</text>
  </g>

  <g transform="translate(640, 405)">
    <rect x="0" y="0" width="340" height="65" rx="12" fill="#1e293b"/>
    <text x="20" y="30" fill="#38bdf8" font-family="Arial, sans-serif" font-size="15" font-weight="bold">EV Ultra Supercharger</text>
    <text x="20" y="50" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">150kW DC Fast Charge ($1.45/kWh)</text>
  </g>

  <g transform="translate(640, 485)">
    <rect x="0" y="0" width="340" height="40" rx="10" fill="#334155"/>
    <text x="170" y="25" fill="#f8fafc" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Buy Portable Jerry Can ($150)</text>
  </g>
</svg>
