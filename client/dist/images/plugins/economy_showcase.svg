<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- In-game ATM & Banking GUI Window -->
  <rect x="150" y="80" width="900" height="515" rx="24" fill="url(#card)" stroke="#475569" stroke-width="2"/>
  
  <!-- GUI Header -->
  <rect x="150" y="80" width="900" height="70" rx="24" fill="#0f172a"/>
  <rect x="150" y="130" width="900" height="20" fill="#0f172a"/>
  <circle cx="190" cy="115" r="8" fill="#ef4444"/>
  <circle cx="215" cy="115" r="8" fill="#f59e0b"/>
  <circle cx="240" cy="115" r="8" fill="#10b981"/>
  <text x="600" y="122" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">BANK OF MINOFORGE — ATM INTERFACE v2.4</text>

  <!-- Balance Card -->
  <rect x="200" y="180" width="380" height="170" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="230" y="220" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" font-weight="bold">TOTAL BALANCE</text>
  <text x="230" y="270" fill="url(#gold)" font-family="Arial, sans-serif" font-size="36" font-weight="900">$2,458,920.00</text>
  <text x="230" y="315" fill="#10b981" font-family="Arial, sans-serif" font-size="14" font-weight="bold">+1.5% Daily Interest Active (Vault Linked)</text>

  <!-- Quick Actions Panel -->
  <rect x="620" y="180" width="380" height="170" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="650" y="220" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" font-weight="bold">ATM QUICK ACTIONS</text>
  <rect x="650" y="240" width="150" height="42" rx="8" fill="#2563eb"/>
  <text x="725" y="267" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Deposit $10,000</text>
  <rect x="820" y="240" width="150" height="42" rx="8" fill="#059669"/>
  <text x="895" y="267" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Withdraw Cash</text>
  <rect x="650" y="295" width="320" height="40" rx="8" fill="#334155"/>
  <text x="810" y="320" fill="#f8fafc" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Transfer to Player (/pay)</text>

  <!-- In-game 9-Slot Pin Pad -->
  <rect x="200" y="380" width="800" height="175" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
  <text x="230" y="420" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Security PIN Protection & Audit Logs</text>
  
  <g transform="translate(230, 445)">
    <rect x="0" y="0" width="160" height="85" rx="10" fill="#1e293b"/>
    <text x="80" y="35" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Last Transaction</text>
    <text x="80" y="62" fill="#10b981" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">+$50,000.00</text>
  </g>

  <g transform="translate(420, 445)">
    <rect x="0" y="0" width="160" height="85" rx="10" fill="#1e293b"/>
    <text x="80" y="35" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Bank PIN Code</text>
    <text x="80" y="62" fill="#f59e0b" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">•••• Verified</text>
  </g>

  <g transform="translate(610, 445)">
    <rect x="0" y="0" width="330" height="85" rx="10" fill="#1e293b"/>
    <text x="165" y="35" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Database Sync Mode</text>
    <text x="165" y="62" fill="#38bdf8" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">MySQL / SQLite Pooling 60FPS</text>
  </g>
</svg>
