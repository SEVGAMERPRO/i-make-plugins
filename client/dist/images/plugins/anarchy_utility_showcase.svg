<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_anarchy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg_anarchy)"/>

  <!-- Minecraft 2b2t In-Game Utility HUD -->
  <rect x="150" y="80" width="900" height="515" rx="24" fill="#090d16" stroke="#10b981" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="150" y="80" width="900" height="60" rx="24" fill="#0f172a"/>
  <rect x="150" y="120" width="900" height="20" fill="#0f172a"/>
  <text x="600" y="120" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">MINO-ANARCHY v3.2 [2b2t.org • GRIM-AC BYPASS ACTIVE]</text>

  <!-- Left: In-Game Modules Active -->
  <rect x="200" y="165" width="370" height="380" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="230" y="205" fill="#10b981" font-family="monospace" font-size="15" font-weight="bold">> ACTIVE MODULES</text>

  <g transform="translate(230, 230)">
    <text x="0" y="0" fill="#ffffff" font-family="monospace" font-size="14">[+] Baritone Auto-Highway #highway 100k</text>
    <text x="0" y="30" fill="#ffffff" font-family="monospace" font-size="14">[+] AutoTotem (Instant Offhand Switch 0ms)</text>
    <text x="0" y="60" fill="#ffffff" font-family="monospace" font-size="14">[+] Surround & Obsidian Anchor Aura</text>
    <text x="0" y="90" fill="#ffffff" font-family="monospace" font-size="14">[+] Stash Finder (Active Chest Chunks: 84)</text>
    <text x="0" y="120" fill="#ffffff" font-family="monospace" font-size="14">[+] ElytraFly Boost (Packet 2.45 b/s)</text>
    <text x="0" y="150" fill="#ffffff" font-family="monospace" font-size="14">[+] Anti-Desync & Packet Optimizer</text>
  </g>

  <!-- Right: Radar & Highway Progress -->
  <rect x="600" y="165" width="400" height="380" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="630" y="205" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold">> HIGHWAY DIGGER TELEMETRY</text>

  <g transform="translate(630, 235)">
    <text x="0" y="0" fill="#94a3b8" font-family="monospace" font-size="13">Target: +X Axis Highway</text>
    <text x="0" y="25" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">Current: X: 142,850 / Z: 0 (Nether)</text>
    <text x="0" y="50" fill="#10b981" font-family="monospace" font-size="13">Speed: 4.8 blocks/second (Pickaxe Safe)</text>
    
    <rect x="0" y="70" width="340" height="20" rx="6" fill="#1e293b"/>
    <rect x="0" y="70" width="240" height="20" rx="6" fill="#10b981"/>
    <text x="170" y="85" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">70% to World Border Goal</text>
  </g>

  <!-- Bottom Inventory status -->
  <g transform="translate(630, 360)">
    <rect x="0" y="0" width="340" height="150" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="30" fill="#f59e0b" font-family="monospace" font-size="13">> SHULKER INVENTORY MONITOR</text>
    <text x="15" y="60" fill="#ffffff" font-family="monospace" font-size="12">Totems: 42 (Safe)</text>
    <text x="15" y="85" fill="#ffffff" font-family="monospace" font-size="12">Gapples: 128</text>
    <text x="15" y="110" fill="#ffffff" font-family="monospace" font-size="12">Netherite Pickaxes: 6 (Efficiency V)</text>
  </g>
</svg>
