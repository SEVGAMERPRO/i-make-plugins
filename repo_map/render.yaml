databases:
  - name: minoforge-db
    plan: free
    databaseName: minoforge
    user: minoforge

services:
  - type: web
    name: minoforge-api
    plan: free
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: minoforge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://minoforge.com
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: b70e6a001@smtp-brevo.com
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: noreply@minoforge.com
      - key: EMAIL_FROM_NAME
        value: MinoForge Official
      - key: ADMIN_EMAIL
        value: support@minoforge.com

  - type: web
    name: minoforge-client
    plan: free
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://minoforge-api.onrender.com
